# Netlify Configuration for AssetMX
# https://docs.netlify.com/configure-builds/file-based-configuration/
# Domain: assetmx.com.au

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Production environment variables set in Netlify Dashboard:
# - VITE_SUPABASE_URL
# - VITE_SUPABASE_ANON_KEY
# - VITE_SITE_URL=https://app.assetmx.com.au
# - VITE_SENTRY_DSN (optional)

# ---- Rebuild (Sep 2026): this React app now lives at app.assetmx.com.au.
# Marketing/answer pages are served by the static Astro site in ./site at assetmx.com.au.
# Send public-content paths there so the SPA is never the canonical source.
[[redirects]]
  from = "/"
  to = "https://assetmx.com.au/"
  status = 301
  force = true

[[redirects]]
  from = "/car-finance"
  to = "https://assetmx.com.au/car-finance"
  status = 301
  force = true

[[redirects]]
  from = "/vehicle-finance"
  to = "https://assetmx.com.au/car-finance"
  status = 301
  force = true

[[redirects]]
  from = "/truck-finance"
  to = "https://assetmx.com.au/truck-finance"
  status = 301
  force = true

[[redirects]]
  from = "/equipment-finance"
  to = "https://assetmx.com.au/equipment-finance"
  status = 301
  force = true

[[redirects]]
  from = "/ev-leasing"
  to = "https://assetmx.com.au/ev-leasing"
  status = 301
  force = true

[[redirects]]
  from = "/how-we-compare"
  to = "https://assetmx.com.au/how-we-compare"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "https://assetmx.com.au/contact"
  status = 301
  force = true

[[redirects]]
  from = "/guides/*"
  to = "https://assetmx.com.au/guides/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "https://assetmx.com.au/terms"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "https://assetmx.com.au/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/credit-guide"
  to = "https://assetmx.com.au/credit-guide"
  status = 301
  force = true

[[redirects]]
  from = "/answers/*"
  to = "https://assetmx.com.au/answers/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/rates"
  to = "https://assetmx.com.au/rates"
  status = 301
  force = true

[[redirects]]
  from = "/lender-policies"
  to = "https://assetmx.com.au/lender-policies"
  status = 301
  force = true

[[redirects]]
  from = "/answers"
  to = "https://assetmx.com.au/answers"
  status = 301
  force = true

[[redirects]]
  from = "/guides"
  to = "https://assetmx.com.au/guides"
  status = 301
  force = true

# SPA Routing - All routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content Security Policy - adjust as needed
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Environment-specific redirects
# Uncomment when Supabase is configured
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-project.supabase.co/functions/v1/:splat"
#   status = 200
#   force = true

# Branch deploys
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
